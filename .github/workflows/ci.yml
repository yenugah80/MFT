name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend – Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install all workspace packages
        run: npm install

      # Nutrition accuracy gate — deterministic, no secrets, <1s. Fails the build if
      # the plausibility checker regresses (a false positive on a real dish, or a
      # missed known error). Runs first because it's fast and needs no external services.
      - name: Nutrition accuracy harness
        run: npm run harness:nutrition --workspace=backend

      - name: Run backend tests
        run: npm test --workspace=backend
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      # Catches schema.js declaring a NOT NULL / default / unique or check
      # constraint that the real database does not have, or vice versa —
      # exactly the shape of bug that let client_event_id's idempotency key
      # silently accept unlimited duplicates on four tables, and that briefly
      # broke activity logging in the other direction when the first fix
      # over-corrected. Fails only on drift NEW since
      # backend/src/db/schemaDriftBaseline.json was captured — see that
      # script's own header for why pre-existing drift is a backlog, not a
      # blocker.
      - name: Schema drift check
        run: npm run check:schema-drift --workspace=backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  mobile:
    name: Mobile – Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Install from the workspace root, not `mobile/` — the root postinstall
      # (patch-package) only resolves when npm sees the workspace root, and
      # scoping install to a member directory left it unresolvable (exit 127).
      - name: Install all workspace packages
        run: npm install

      # Resolves every design-token path (SPACING.md, SEMANTIC.danger.base, …)
      # against the real theme objects. These are invisible to ESLint — property
      # access on an imported object always type-checks — and only surface when
      # the screen renders, so a rarely visited screen can ship broken. A missing
      # intermediate segment crashes; this is what caught the Privacy & Data
      # screen being unrenderable, which made account deletion unreachable.
      - name: Validate design tokens
        working-directory: mobile
        run: npm run validate:tokens

      # Guards the store-submission invariants: permission strings must match
      # installed native SDKs (declaring health access without the SDK invites
      # rejection; missing a camera usage string terminates the app on first
      # use), ascAppId present, privacy manifest complete, no committed secrets.
      - name: Validate release config
        working-directory: mobile
        run: npm run validate:release

      # The job is named "Lint & Test" but never linted. Warnings are tolerated
      # (the codebase carries many); errors are not.
      - name: Lint
        working-directory: mobile
        run: npx eslint . --max-warnings=-1

      - name: Run tests
        working-directory: mobile
        run: npm test -- --passWithNoTests --watchAll=false

  worker:
    name: Worker – Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install all workspace packages
        run: npm install
